modLoader = "lowcodefml"
loaderVersion = "[47,)"
license = 'https://github.com/${repository}/blob/1.20.x/LICENSE.txt'
issueTrackerURL = "https://github.com/${repository}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''Multiplatform Extensions'''

[[dependencies.${mod_id}]]
modId = "multikulti_core"
mandatory = true
versionRange = "[${mod_version},)"
ordering = "NONE"
side = "BOTH"